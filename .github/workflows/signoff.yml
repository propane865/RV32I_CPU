name: signoff

on:
  push:
  pull_request:

jobs:
  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator yosys

      # Both builds are linted. The behavioural and SRAM memories declare the same
      # module names, so the two filelists are checked separately - this is what
      # stops the ASIC path from silently rotting.
      - name: Lint (simulation build)
        run: make lint

      - name: Lint (sky130 build)
        run: make lint-asic

      # Behaviour gate: transcript must match build/baseline.log and must contain
      # a verdict.
      - name: Regression check
        run: make check

      # The regression run only ever exercises one memory build, so check the
      # substitution itself: same stimulus into both, same values out.
      - name: Memory models agree
        run: make mem-agree

      # "Is this still synthesizable" gate + cell/flop count for area regressions.
      - name: Synthesis (behavioural memories)
        run: make synth

      # The same gate over the build OpenLane would see, macros and all. Without
      # it the SRAM wrappers are only ever linted, never elaborated by a
      # synthesizer.
      - name: Synthesis (sky130 memories)
        run: make synth-asic

      # Exact per-stage pipeline storage; catches a field added to a stage
      # register, which the memory-dominated design-wide count cannot.
      - name: Pipeline storage
        run: make pipe-stats

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-logs
          path: build/*.log
